name: Deploy Pages

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inyectar fecha del último cambio de certifications/index.html
        run: |
          FECHA=$(LC_TIME=C git log -1 --format="%cd" --date=format:"%B %d, %Y &#8213; %H:%M:%S" -- certifications/index.html)
          FECHA=$(echo "$FECHA" | sed 's/&/\\\&/g')
          sed -i "s/{{LAST_UPDATE}}/$FECHA/g" certifications/index.html

      - name: Generar estadísticas de YouTube
        if: hashFiles('labs/labs-data.js') != ''
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/fetch_stats.py

      - name: Preparar carpeta a publicar
        run: |
          mkdir _site
          cp -r index.html CNAME robots.txt certifications css img js _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
